# docker-compose.yml - the whole non-Kubernetes stack. Every service
# that needs to talk to another one does so by container name
# (e.g. "mlflow", "postgres") over the network Compose creates
# automatically - that's why URLs below use those names instead of
# localhost. See k8s/ for the separate FastAPI + HPA autoscaling
# piece, which deliberately isn't part of this file.

x-airflow-common:
  # Shared config reused by airflow-init/webserver/scheduler below via
  # YAML anchors (&airflow-common / <<: *airflow-common), so the three
  # containers can't silently drift out of sync with each other.
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    # PARALLELISM/MAX_ACTIVE_TASKS/MAX_ACTIVE_RUNS all forced to 1:
    # the retraining DAG trains 4 candidate models sequentially, not
    # in parallel, since the Kali VM (4 CPU cores) doesn't have room
    # to run several training jobs at once without starving each
    # other. A bigger machine could relax this.
    AIRFLOW__CORE__PARALLELISM: '1'
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '1'
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: '1'
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    MLFLOW_TRACKING_URI: http://mlflow:5000
    SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    # Needed for the retraining DAG's new dvc_pull task to authenticate
    # to S3 - same credentials the training service already uses.
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - .:/opt/airflow/project
    - mlflow_artifacts:/mlflow/artifacts
  user: "${AIRFLOW_UID}:0"
  depends_on:
    airflow-postgres:
      condition: service_healthy
    artifacts-init:
      condition: service_completed_successfully

services:
  postgres:
    # Backs MLflow's tracking store (experiments, runs, metrics,
    # registered model versions) - separate database from Airflow's
    # own Postgres below, so the two systems can't collide.
    image: postgres:16-alpine
    container_name: mlops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  artifacts-init:
    # Runs once and exits. Fixes a real problem hit early on: the
    # mlflow_artifacts volume is created root-owned by Docker by
    # default, but MLflow, the API, and the training container all
    # need to write into it - this chmod runs before any of them
    # start, so none of them hit a permission error on first boot.
    image: busybox
    container_name: artifacts-init
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    command: ["sh", "-c", "chmod -R 777 /mlflow/artifacts"]

  mlflow:
    # Tracking server + model registry + artifact store, all in one.
    # --serve-artifacts makes it hand out model files over HTTP
    # instead of only through the shared Docker volume - originally
    # added so the Kubernetes-deployed FastAPI pod (which can't see
    # this Compose network or its volumes at all) can still reach the
    # champion model via host.minikube.internal, listed below in
    # --allowed-hosts alongside the normal Compose-network hostnames.
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: mlops-mlflow
    restart: unless-stopped
    ports:
      # Bound specifically to minikube's docker-bridge gateway IP, not
      # 0.0.0.0 (open to the whole network) or 127.0.0.1 (which would
      # block minikube too - host.minikube.internal resolves to this
      # gateway address, not to loopback). This is the one address
      # that reaches both "the pod, via the bridge" and "nothing else
      # on the LAN". Confirmed via:
      #   docker network inspect minikube -f '{{range .IPAM.Config}}{{.Gateway}}{{end}}'
      # This IP is specific to the docker driver and this machine's
      # minikube network - a different driver (KVM/VirtualBox) or a
      # fresh `minikube delete && minikube start` could assign a
      # different subnet. Re-run the command above to confirm if this
      # stops working.
      - "192.168.49.1:5001:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      artifacts-init:
        condition: service_completed_successfully
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "mlflow:*,localhost:*,127.0.0.1:*,host.minikube.internal:*"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-postgres:
    # Airflow's own metadata database (DAG runs, task state, users) -
    # deliberately separate from the "postgres" service above so
    # Airflow and MLflow never share a database.
    image: postgres:16-alpine
    container_name: airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    # Runs once and exits: creates Airflow's DB schema and the admin
    # user, then the real webserver/scheduler below start only after
    # this finishes successfully (see their depends_on).
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        exec /entrypoint bash -c "
          airflow db migrate &&
          airflow users create \
            --username ${AIRFLOW_ADMIN_USER} \
            --password ${AIRFLOW_ADMIN_PASSWORD} \
            --firstname Chuck \
            --lastname Norris \
            --role Admin \
            --email admin@example.com
        "

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    # The actual process that watches the DAG's schedule and triggers
    # runs - the webserver above is only the UI, it doesn't run
    # anything on its own.
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  api:
    # Serves live predictions. Loads whichever model MLflow currently
    # has aliased "champion" at startup - see api/main.py for why
    # that means this container never needs to change when a new
    # model wins a retrain.
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: mlops-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
      artifacts-init:
        condition: service_completed_successfully

  training:
    # Not a long-running server - this container exists so
    # docker compose run --rm training <script> has an environment
    # with the right dependencies and AWS/DVC access already wired
    # up, without polluting the api image with training-only libraries.
    # Runs as AIRFLOW_UID, not root: this container and Airflow's
    # preprocess task both write to data/ and models/preprocessing/,
    # which are host bind-mounts (.:/app) not Docker volumes - so
    # whatever UID creates a file there sets real, permanent
    # filesystem permissions on disk. Matching the UID means both
    # writers can always read/overwrite each other's files without
    # needing world-writable (umask 000) permissions to paper over
    # a UID mismatch.
    build:
      context: .
      dockerfile: Dockerfile.training
    container_name: mlops-training
    user: "${AIRFLOW_UID}:0"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    volumes:
      - .:/app
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      mlflow:
        condition: service_healthy
      artifacts-init:
        condition: service_completed_successfully

  prometheus:
    # Scrapes /metrics off the api service on the interval configured
    # in prometheus/prometheus.yml - Grafana below reads from
    # Prometheus, never from the API directly.
    image: prom/prometheus:latest
    container_name: mlops-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    container_name: mlops-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

volumes:
  postgres_data:
  mlflow_artifacts:
  airflow_postgres_data:
  prometheus_data:
  grafana_data: